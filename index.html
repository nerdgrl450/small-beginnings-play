<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171f1a">
  <meta name="description" content="Grow a little lemonade stand and build a life of your own in Willowbrook.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./art/touch-icon.png">
  <link rel="icon" href="./art/icon-192.png">
  <link rel="preload" href="./art/stand-table.webp" as="image">
  <link rel="stylesheet" href="./release-c48837d9f9d193d9/style.css">
  <title>Small Beginnings</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Small Beginnings">
        <span class="brand-icon" data-icon="sprout"></span>
        <span>Small<br>Beginnings</span>
      </a>
      <div class="header-right" id="status"></div>
      <button class="icon-button settings-button" id="settings" aria-label="Settings and saves" title="Settings and saves" data-icon="settings"></button>
    </div>
  </header>
  <main class="main" id="main" aria-busy="true">
    <div class="intro">
      <div>
        <p class="location" id="location">Willowbrook</p>
        <h1 id="title">Lemonade Stand</h1>
      </div>
      <div id="scene-status"></div>
    </div>
    <p id="staff-notice" class="staff-notice" role="status" hidden></p>
    <div class="layout">
      <div class="scene-column">
        <section class="scene" id="scene" aria-label="Current location illustration">
          <img class="scene-image" id="scene-image" src="./art/stand-table.webp" alt="A folding table with a pitcher and paper cups on Willow Lane." fetchpriority="high">
          <div class="scene-light" id="scene-light"></div>
          <div class="scene-props" id="scene-props" aria-hidden="true"></div>
          <div class="scene-staff" id="scene-staff" aria-hidden="true"></div>
          <div class="scene-customers" id="scene-customers" aria-hidden="true"></div>
          <div class="scene-shade"></div>
          <div class="scene-time" id="scene-time"></div>
          <div class="scene-caption" id="scene-caption"></div>
        </section>
        <div id="scene-extra"></div>
      </div>
      <section class="management" id="panel" aria-label="Game actions">
        <p class="loading">Opening your game…</p>
      </section>
    </div>
  </main>
  <nav class="navigation" aria-label="Town locations">
    <div class="navigation-inner">
      <button data-view="stand" aria-current="page"><span data-icon="stand"></span><span>Stand</span></button>
      <button data-view="home"><span data-icon="home"></span><span>Home</span></button>
      <button data-view="market"><span data-icon="basket"></span><span>Market</span></button>
      <button data-view="ledger"><span data-icon="book"></span><span>Ledger</span></button>
      <button id="open-music" aria-label="Music Box" aria-haspopup="dialog"><span data-icon="radio"></span><span>Music</span></button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title">Settings &amp; saves</h2>
      <form method="dialog"><button class="icon-button" aria-label="Close" data-icon="x"></button></form>
    </div>
    <div id="dialog-content"></div>
  </dialog>
  <dialog id="prep-dialog" aria-labelledby="prep-title">
    <div class="dialog-head">
      <h2 id="prep-title">Make Lemonade</h2>
      <form method="dialog"><button class="icon-button" aria-label="Close preparation" data-icon="x"></button></form>
    </div>
    <div id="prep-content"></div>
  </dialog>
  <input id="save-file" type="file" accept=".json,application/json" hidden>
  <dialog id="music-dialog" aria-labelledby="music-heading">
    <div class="dialog-head">
      <h2 id="music-heading">Music Box</h2>
      <form method="dialog"><button class="icon-button" aria-label="Close Music Box" data-icon="x"></button></form>
    </div>
    <section class="music-player" aria-label="Now playing">
      <div class="music-radio" aria-hidden="true"><span data-icon="radio"></span></div>
      <div class="music-display">
        <p class="music-collection">All songs</p>
        <p class="music-title" aria-live="polite">No song selected</p>
        <p class="music-time"></p>
      </div>
      <div class="music-transport">
        <button type="button" class="icon-button" data-music="previous" aria-label="Previous song" data-icon="previous" disabled></button>
        <button type="button" class="icon-button music-play" data-music="play" aria-label="Play" data-icon="play" disabled></button>
        <button type="button" class="icon-button" data-music="next" aria-label="Next song" data-icon="next" disabled></button>
      </div>
      <div class="music-modes">
        <button type="button" class="button secondary music-small" data-music="shuffle" aria-pressed="false">Shuffle</button>
        <button type="button" class="button secondary music-small" data-music="repeat">Repeat off</button>
      </div>
      <label class="music-volume" for="music-volume"><span>Volume</span><input id="music-volume" type="range" min="0" max="100" value="60"></label>
    </section>
    <p class="music-notice" role="status"></p>
    <section class="music-library" aria-label="Music library"><p>Opening the music library…</p></section>
    <input id="music-files" type="file" accept=".mp3,audio/mpeg" multiple hidden>
    <input id="music-replacement" type="file" accept=".mp3,audio/mpeg" hidden>
  </dialog>
  <script type="module" src="./release-c48837d9f9d193d9/app.js"></script>
</body>
</html>
