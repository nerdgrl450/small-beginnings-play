<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e8">
  <meta name="description" content="Grow a little lemonade stand and build a life of your own in Willowbrook.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./art/touch-icon.png">
  <link rel="icon" href="./art/icon-192.png">
  <link rel="preload" href="./art/stand.webp" as="image">
  <link rel="stylesheet" href="./style.css">
  <title>Small Beginnings</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Small Beginnings">
        <span class="brand-icon" data-icon="sprout"></span>
        <span>Small<br>Beginnings</span>
      </a>
      <div class="header-right" id="status"></div>
      <button class="icon-button settings-button" id="settings" aria-label="Settings and saves" title="Settings and saves" data-icon="settings"></button>
    </div>
  </header>
  <main class="main" id="main" aria-busy="true">
    <div class="intro">
      <div>
        <p class="location" id="location">Willowbrook</p>
        <h1 id="title">Lemonade Stand</h1>
      </div>
      <div id="scene-status"></div>
    </div>
    <div class="layout">
      <div class="scene-column">
        <section class="scene" id="scene" aria-label="Current location illustration">
          <img class="scene-image" id="scene-image" src="./art/stand.webp" alt="A handmade lemonade stand on a sunny village lane." fetchpriority="high">
          <div class="scene-light" id="scene-light"></div>
          <div class="scene-props" id="scene-props" aria-hidden="true"></div>
          <div class="scene-shade"></div>
          <div class="scene-time" id="scene-time"></div>
          <div class="scene-caption" id="scene-caption"></div>
        </section>
        <div id="scene-extra"></div>
      </div>
      <section class="management" id="panel" aria-label="Game actions">
        <p class="loading">Opening your game…</p>
      </section>
    </div>
  </main>
  <nav class="navigation" aria-label="Town locations">
    <div class="navigation-inner">
      <button data-view="stand" aria-current="page"><span data-icon="stand"></span><span>Stand</span></button>
      <button data-view="home"><span data-icon="home"></span><span>Home</span></button>
      <button data-view="market"><span data-icon="basket"></span><span>Market</span></button>
      <button data-view="ledger"><span data-icon="book"></span><span>Ledger</span></button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title">Settings &amp; saves</h2>
      <form method="dialog"><button class="icon-button" aria-label="Close" data-icon="x"></button></form>
    </div>
    <div id="dialog-content"></div>
  </dialog>
  <input id="save-file" type="file" accept=".json,application/json" hidden>
  <script type="module" src="./app.js"></script>
</body>
</html>
